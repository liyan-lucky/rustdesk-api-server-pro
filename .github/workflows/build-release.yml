name: 构建并发布版本
run-name: 发布构建（${{ github.ref_name || github.sha }}）

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布标签；留空时读取 VERSION 并生成 vX.Y.Z"
        required: false
        type: string
      target_ref:
        description: "构建来源分支或提交"
        required: true
        default: "main"
        type: string
      release_title:
        description: "发布标题；留空时使用默认标题"
        required: false
        type: string
      prerelease:
        description: "标记为预发布版本"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      release_title: ${{ steps.release.outputs.release_title }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: 检出发布来源
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}

      - name: 校验发布参数
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_TITLE: ${{ inputs.release_title }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            tag_name="${INPUT_TAG:-v${version}}"
          fi
          [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "标签格式无效: $tag_name" >&2
            exit 1
          }
          if [[ "$tag_name" != "v${version}" && "$tag_name" != "v${version}-"* && "$tag_name" != "v${version}."* ]]; then
            echo "标签 $tag_name 与 VERSION=$version 不一致" >&2
            exit 1
          fi
          release_title="${INPUT_TITLE:-RustDesk API Server Pro（${tag_name}）}"
          [[ "$release_title" != *$'\n'* && "$release_title" != *$'\r'* ]] || {
            echo "发布标题不能包含换行符" >&2
            exit 1
          }
          target_sha="$(git rev-parse HEAD)"
          existing_tag="$(git ls-remote origin "refs/tags/${tag_name}^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$existing_tag" ]]; then
            existing_tag="$(git ls-remote origin "refs/tags/${tag_name}" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -n "$existing_tag" && "$existing_tag" != "$target_sha" ]]; then
            echo "标签 $tag_name 已指向 $existing_tag，不能改写为 $target_sha" >&2
            exit 1
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "prerelease=${INPUT_PRERELEASE:-false}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23.1'
          cache: false

      - name: 记录构建时间
        id: build_time
        run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: 安装构建依赖
        run: |
          sudo apt update
          sudo apt install make zip -y
          cd soybean-admin && pnpm install --frozen-lockfile
      
      - name: 编译项目
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.tag_name }}
          VITE_BUILD_TIME: ${{ steps.build_time.outputs.value }}
          APP_VERSION: ${{ needs.prepare.outputs.tag_name }}
          BUILD_TIME: ${{ steps.build_time.outputs.value }}
        run: |
          go env -w GOOS=${{matrix.os}}
          go env -w GOARCH=${{matrix.arch}}
          go build -C backend -ldflags "-X main.appVersion=${APP_VERSION} -X main.buildTime=${BUILD_TIME}" -o ../build/
          cd soybean-admin && pnpm build 
          cd .. && cp -R soybean-admin/dist build/
          cp backend/server.yaml build/
          cp LICENSE build/
          cp NOTICE build/
          cp THIRD_PARTY_NOTICES.md build/
          cp DISCLAIMER.md build/
          cp SECURITY.md build/
          cp PRIVACY.md build/
          cp COMPLIANCE.md build/
          cp CONTRIBUTING.md build/
          cp CODE_OF_CONDUCT.md build/
          cp SUPPORT.md build/
          mkdir -p build/docs
          cp docs/LEGAL_COMPLIANCE.md build/docs/LEGAL_COMPLIANCE.md
          cp docs/DOCKER.md build/docs/DOCKER.md
          cp docs/OPENWRT_ONE_CONTAINER.md build/docs/OPENWRT_ONE_CONTAINER.md

      - name: 打包文件
        run: |
          zip -r ${{matrix.os}}-${{matrix.arch}}.zip build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{matrix.os}}-${{matrix.arch}}.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - name: 检出发布模板
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成发布文案
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          cp .github/RELEASE_TEMPLATE.md release-body.md
          sed -i "s|{tag}|${RELEASE_TAG}|g" release-body.md
          sed -i "s|{version}|${RELEASE_TAG#v}|g" release-body.md
          sed -i "s|{commit}|${RELEASE_SHA}|g" release-body.md
          sed -i "s|{date}|$(date -u '+%Y-%m-%d')|g" release-body.md

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          name: ${{ needs.prepare.outputs.release_title }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          generate_release_notes: false
          body_path: release-body.md
          files: release-assets/*.zip
